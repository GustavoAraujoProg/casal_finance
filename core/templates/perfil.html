<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Quem gasta mais?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .avatar { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .bg-gradient-primary { background: linear-gradient(45deg, #4e73df, #224abe); }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}"><i class="fas fa-arrow-left me-2"></i> Voltar</a>
            <span class="navbar-text text-white fw-bold">Disputa Financeira</span>
        </div>
    </nav>

    <div class="container mt-5">
        <h3 class="text-center mb-5 fw-bold text-secondary"> Ranking de Gastos</h3>

        <div class="row justify-content-center">
            {% for u in dados %}
            <div class="col-md-4 text-center mb-4">
                <div class="card border-0 shadow-sm p-3">
                    <div class="card-body">
                        {% if u.foto %}
                            <img src="{{ u.foto }}" class="avatar mb-3">
                        {% else %}
                            <div class="avatar mb-3 d-flex align-items-center justify-content-center bg-secondary text-white mx-auto fs-1">
                                {{ u.nome|slice:":1" }}
                            </div>
                        {% endif %}
                        
                        <h4 class="fw-bold">{{ u.nome }}</h4>
                        <h5 class="text-danger fw-bold my-3">R$ {{ u.total }}</h5>
                        
                        <div class="progress" style="height: 20px;">
                            <div class="progress-bar bg-danger" role="progressbar" style="width: {{ u.porcentagem }}%">
                                {{ u.porcentagem }}%
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            {% if forloop.first and not forloop.last %}
                <div class="col-md-1 d-flex align-items-center justify-content-center">
                    <h1 class="fw-bold text-muted">VS</h1>
                </div>
            {% endif %}
            
            {% endfor %}
        </div>
    </div>

</body>
</html>
